<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>PuzzlePlayer</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/library.css">
    <link rel="stylesheet" href="css/solver.css">
</head>
<body>
    <!-- Library: the home page -->
    <section id="library-view" class="view library-view">
        <header class="lib-topbar">
            <button type="button" class="lib-icon-btn lib-back-btn" aria-label="Up one folder" hidden>
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="lib-heading">
                <h1 class="lib-title">Puzzles</h1>
                <div class="lib-path" hidden></div>
            </div>
            <button type="button" class="lib-icon-btn lib-sort-btn" aria-label="Sort">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7 4v15M3.5 15.5 7 19l3.5-3.5M17 20V5M13.5 8.5 17 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="lib-icon-btn lib-folder-btn" aria-label="New folder">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.3l2 2.2h8.7A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 11.2v5.6M9.2 14h5.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="lib-icon-btn lib-add-btn" aria-label="Add puzzles">
                <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
            </button>
        </header>
        <div class="lib-searchbar">
            <svg class="lib-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="search" class="lib-search" placeholder="Search by title or author" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
            <button type="button" class="lib-search-clear" aria-label="Clear search" hidden>&times;</button>
        </div>
        <main class="lib-list"></main>
    </section>

    <!-- Solver -->
    <section id="solver-view" class="view solver-view" hidden>
        <div class="solver">
            <div class="solver-main">
                <div class="solver-topbar">
                    <div class="topbar-left">
                        <button type="button" class="icon-btn back-btn" aria-label="Back to puzzles">
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                    <div class="timer-wrap" role="button" aria-label="Pause">
                        <span class="timer-display">0:00</span>
                        <button type="button" class="icon-btn timer-pause-btn" tabindex="-1" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="14" height="14"><rect x="5" y="3.5" width="4.5" height="17" rx="1.2" fill="currentColor"/><rect x="14.5" y="3.5" width="4.5" height="17" rx="1.2" fill="currentColor"/></svg>
                        </button>
                    </div>
                    <div class="topbar-right">
                        <button type="button" class="icon-btn pencil-btn" aria-label="Pencil mode" aria-pressed="false">
                            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m13.8 6.8 3.4 3.4" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <div class="help-wrap">
                            <button type="button" class="icon-btn help-btn" aria-label="Check and reveal" aria-haspopup="menu">
                                <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M8.6 9a3.5 3.5 0 1 1 5.1 3.1c-1 .5-1.7 1.3-1.7 2.4v.7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="19.3" r="1.5" fill="currentColor"/></svg>
                            </button>
                            <div class="help-menu" role="menu" hidden>
                                <button type="button" class="solver-btn" data-action="check-square">Check square</button>
                                <button type="button" class="solver-btn" data-action="check-word">Check word</button>
                                <button type="button" class="solver-btn" data-action="check-puzzle">Check puzzle</button>
                                <button type="button" class="solver-btn" data-action="reveal-square">Reveal square</button>
                                <button type="button" class="solver-btn" data-action="reveal-word">Reveal word</button>
                                <button type="button" class="solver-btn" data-action="reveal-puzzle">Reveal puzzle</button>
                                <button type="button" class="solver-btn" data-action="clear-incorrect">Clear incorrect</button>
                                <button type="button" class="solver-btn" data-action="reset">Reset puzzle</button>
                                <button type="button" class="solver-btn" data-action="info">Puzzle info</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="solver-layout">
                    <div class="solver-grid-wrap">
                        <div class="solver-grid" tabindex="0" aria-label="Crossword grid"></div>
                    </div>
                </div>

                <div class="mobile-clue-bar">
                    <button type="button" class="clue-nav-btn clue-prev" aria-label="Previous clue">&lsaquo;</button>
                    <div class="clue-text"><span class="clue-inner"></span></div>
                    <button type="button" class="clue-nav-btn clue-next" aria-label="Next clue">&rsaquo;</button>
                </div>

                <div class="solver-overlay" hidden>
                    <div class="solver-overlay-card">
                        <h2 class="overlay-title"></h2>
                        <p class="overlay-author"></p>
                        <p class="overlay-copyright"></p>
                        <p class="overlay-notes"></p>
                        <p class="overlay-paused-message" hidden></p>
                        <button type="button" class="overlay-start-btn">Start</button>
                    </div>
                </div>

                <div class="rebus-overlay" hidden>
                    <div class="solver-overlay-card">
                        <h2 class="overlay-title">Rebus</h2>
                        <p class="overlay-notes">Type several letters into this square.</p>
                        <div class="rebus-display"></div>
                        <div class="rebus-actions">
                            <button type="button" class="icon-btn rebus-action-btn rebus-cancel-btn" aria-label="Cancel">
                                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
                            </button>
                            <button type="button" class="icon-btn rebus-action-btn rebus-confirm-btn" aria-label="Enter">
                                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mobile-keyboard" aria-label="Keyboard"></div>
        </div>

        <div class="landscape-blocker"><p>Turn your phone upright to solve.</p></div>
    </section>

    <!-- Shared dialogs -->
    <div class="sheet-backdrop" hidden></div>
    <div class="toast" hidden></div>
    <input type="file" class="file-input-fallback" multiple accept=".puz,.ipuz,.jpz,.xml,.json" hidden>

    <script src="js/storage.js"></script>
    <script src="js/parsers.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/solver.js"></script>
    <script src="js/library.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
