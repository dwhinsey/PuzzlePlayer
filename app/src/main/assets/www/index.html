<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>puzPlayer</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/library.css">
    <link rel="stylesheet" href="css/solver.css">
    <link rel="stylesheet" href="css/theme-dark.css">
    <link rel="stylesheet" href="css/grid-colors.css">
</head>
<body>
    <!-- Library: the home page -->
    <section id="library-view" class="view library-view">
        <header class="lib-topbar">
            <button type="button" class="lib-icon-btn lib-back-btn" aria-label="Up one folder" hidden>
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="lib-heading">
                <h1 class="lib-title">Puzzles</h1>
                <div class="lib-path" hidden></div>
            </div>
            <button type="button" class="lib-icon-btn lib-search-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.3" fill="none" stroke="currentColor" stroke-width="2.8"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="lib-icon-btn lib-sort-btn" aria-label="Sort">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7 4v11M17 20V9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M2.8 14.2h8.4L7 19.8zM12.8 9.8h8.4L17 4.2z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="lib-icon-btn lib-folder-btn" aria-label="New folder">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><defs><mask id="new-folder-plus"><rect width="24" height="24" fill="#fff"/><path d="M12 12v4.2M9.9 14.1h4.2" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></mask></defs><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.3l2 2.2h8.7A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" mask="url(#new-folder-plus)"/></svg>
            </button>
            <button type="button" class="lib-icon-btn lib-add-btn" aria-label="Add puzzles">
                <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="lib-icon-btn settings-btn" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
            </button>
            <!-- Shown in place of the row above while searching. -->
            <div class="lib-search-row">
                <button type="button" class="lib-icon-btn lib-search-close" aria-label="Close search">
                    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="lib-search-field">
                    <input type="search" class="lib-search" placeholder="Search by title, author or size" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
                    <button type="button" class="lib-search-clear" aria-label="Clear search" hidden>&times;</button>
                </div>
            </div>
        </header>
        <main class="lib-list"></main>
    </section>

    <!-- Solver: js/crossword-solver.js builds the interface inside .solver-host -->
    <section id="solver-view" class="view solver-view" hidden>
        <header class="solver-header">
            <button type="button" class="lib-icon-btn solver-header-back" aria-label="Back to puzzles">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="solver-header-text">
                <div class="solver-header-title"></div>
                <div class="solver-header-sub"></div>
            </div>
            <button type="button" class="lib-icon-btn settings-btn" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
            </button>
        </header>
        <div class="solver-host"></div>
    </section>

    <!-- Shared dialogs -->
    <div class="sheet-backdrop" hidden></div>
    <div class="toast" hidden></div>
    <input type="file" class="file-input-fallback" multiple accept=".puz,.ipuz,.jpz,.xml,.json" hidden>

    <script src="js/storage.js"></script>
    <script src="js/parsers.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/grid-colors.js"></script>
    <script src="js/crossword-solver.js"></script>
    <script src="js/solver-app.js"></script>
    <script src="js/library.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
