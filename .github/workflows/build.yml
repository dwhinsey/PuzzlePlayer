name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners come with the Android SDK; this makes sure
      # the platform the app compiles against is installed.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # The upload key for Google Play, from the repository's secrets
      # (Settings > Secrets and variables > Actions): UPLOAD_KEYSTORE_BASE64
      # (the .jks file, base64) and UPLOAD_KEYSTORE_PASSWORD. Without them
      # the release bundle is built unsigned.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key secret: the release bundle will be unsigned."
          fi

      # The debug APK to install by hand, and the release bundle (.aab) for
      # Google Play. The version code is this run's number, so each bundle
      # is higher than the last.
      - name: Build debug APK and release bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: puzPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: puzPlayer-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  # Installs the APK on an Android 15 emulator, checks it starts, and runs
  # a short solve-quit-relaunch test through the WebView. It takes far longer
  # than the build, so it runs only when started by hand: Actions tab >
  # Build APK > Run workflow.
  emulator-test:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: puzPlayer-debug-apk
          path: apk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test tools
        run: npm install --prefix ci --no-audit --no-fund

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: NODE_PATH=ci/node_modules bash ci/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-output-api-${{ matrix.api-level }}
          path: emulator-output
